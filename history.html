<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2fb8">
<meta name="description" content="Skip URL: riwayat link yang pernah Anda bypass.">
<title>Riwayat — Skip URL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){try{var t=localStorage.getItem("skipurl.theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<a class="skip" href="#main">Lewati ke konten</a>
<main class="wrap" id="main">
  <div class="top">
    <a class="logo" href="index.html"><i><svg viewBox="0 0 24 24"><path d="M5 5l7 7-7 7"/><path d="M13 5l7 7-7 7"/></svg></i>Skip URL</a>
    <div class="tools">
      <nav aria-label="Navigasi utama">
        <a href="index.html">Bypass</a>
        <a href="domains.html">Domain</a>
        <a href="history.html" aria-current="page">Riwayat</a>
      </nav>
      <button type="button" class="iconbtn" id="theme" aria-label="Ganti tema"></button>
      <button type="button" class="sndbtn iconbtn" id="sound" aria-pressed="true" aria-label="Matikan suara"></button>
      <button type="button" class="iconbtn" id="settings" aria-label="Pengaturan"></button>
    </div>
  </div>

  <header class="hero">
    <h1 class="small">Riwayat bypass</h1>
    <p class="sub">Daftar link yang pernah Anda bypass. Data tersimpan di browser ini saja.</p>
  </header>

  <div id="stats" class="stats" hidden></div>

  <div class="search">
    <div class="box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Cari di riwayat" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Cari di riwayat">
    </div>
  </div>

  <div class="tabs" role="group" aria-label="Filter riwayat">
    <button type="button" data-filter="all" aria-pressed="true">Semua</button>
    <button type="button" data-filter="ok" aria-pressed="false">Berhasil</button>
    <button type="button" data-filter="fail" aria-pressed="false">Gagal</button>
  </div>

  <div class="meta">
    <span id="summary"></span>
    <button type="button" class="linkbtn" id="export" hidden>Ekspor JSON</button>
    <button type="button" class="linkbtn" id="clear" hidden>Hapus semua</button>
  </div>

  <div id="list"></div>
</main>

<script src="js/services.js"></script>
<script src="js/common.js"></script>
<script src="js/fx.js"></script>
<script>window.SkipCommon.initTheme();</script>
<script src="js/history.js"></script>
</body>
</html>
